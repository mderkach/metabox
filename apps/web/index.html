<!doctype html>
<!-- Default theme is dark, and the class is set before the script loads:
     otherwise the first frame is painted with the light palette and the panel
     flashes white. next-themes picks it up and switches it further. -->
<html lang="ru" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>metabox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
