name: fork release watch

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Bump and regenerate, print the diff, push nothing
        type: boolean
        default: false

# One bump at a time: an existing branch is never overwritten.
concurrency:
  group: fork-release-watch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  FORK: shtorm-7/sing-box-extended
  BRANCH: build/bump-sing-box-extended
  # A PR opened with the default token starts no workflows, so the required checks never run.
  # The default token can compare versions; mutations require FORK_BUMP_TOKEN.
  GH_TOKEN: ${{ secrets.FORK_BUMP_TOKEN || github.token }}
  FORK_BUMP_TOKEN_AVAILABLE: ${{ secrets.FORK_BUMP_TOKEN != '' }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ env.GH_TOKEN }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            tools/schemagen/go.mod
            tools/schemagen/go.sum

      - name: Compare the pin with the latest release
        id: versions
        run: bash .github/scripts/fork-release-check.sh

      # Go does not inherit replace from dependencies, so the pin and the fork's own replace
      # directives move together: the block is rebuilt from the fork's go.mod at the new tag.
      - name: Bump the pin and regenerate the schema
        if: steps.versions.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          curl -fsS "https://raw.githubusercontent.com/$FORK/$LATEST/go.mod" > "$RUNNER_TEMP/fork.go.mod"
          grep '^replace ' "$RUNNER_TEMP/fork.go.mod" > "$RUNNER_TEMP/fork.replace"
          [ -s "$RUNNER_TEMP/fork.replace" ] || { echo "::error::the fork go.mod at $LATEST has no replace directives"; exit 1; }

          mod=tools/schemagen/go.mod
          grep -v '^replace ' "$mod" | awk 'NF { while (blank-- > 0) print ""; blank = 0; print; next } { blank++ }' > "$RUNNER_TEMP/go.mod.head"
          {
            cat "$RUNNER_TEMP/go.mod.head"
            echo "replace github.com/sagernet/sing-box => github.com/$FORK $LATEST"
            while read -r line; do printf '\n%s\n' "$line"; done < "$RUNNER_TEMP/fork.replace"
          } > "$mod"
          sed -i "s|^const forkVersion = .*|const forkVersion = \"$LATEST\"|" tools/schemagen/main.go

          (cd tools/schemagen && go mod tidy)
          make schema
          git diff --stat

      - name: Open or update the PR
        if: steps.versions.outputs.changed == 'true'
        env:
          PINNED: ${{ steps.versions.outputs.pinned }}
          LATEST: ${{ steps.versions.outputs.latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git diff -- apps/web/src/shared/api/generated.ts > "$RUNNER_TEMP/schema.diff"
          {
            echo "The fork released [\`$LATEST\`](https://github.com/$FORK/releases/tag/$LATEST); the schema generator is pinned to \`$PINNED\`."
            echo
            echo "- pinned: \`$PINNED\`"
            echo "- latest: \`$LATEST\`"
            echo "- fork diff: https://github.com/$FORK/compare/$PINNED...$LATEST"
            echo
            echo "Raised: the \`replace\` block of \`tools/schemagen/go.mod\` (synchronized with the fork's go.mod), \`forkVersion\` in \`tools/schemagen/main.go\`, and the schema and the MCP field reference regenerated by \`make schema\`."
            echo "Not touched: \`SINGBOX_VERSION\` of the test bench, \`install.sh\` and the README version. They follow the binary tested on the router."
            echo
            echo "<details><summary>Schema diff (\`generated.ts\`)</summary>"
            echo
            echo '```diff'
            head -c 40000 "$RUNNER_TEMP/schema.diff"
            echo
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Opened by the \`fork release watch\` workflow."
          } > "$RUNNER_TEMP/body.md"

          if [ "$DRY_RUN" = true ]; then
            echo "dry run: nothing pushed"
            cat "$RUNNER_TEMP/body.md"
            exit 0
          fi

          title="build(schema): bump sing-box-extended to $LATEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add tools/schemagen apps/web/src/shared/api/generated.ts apps/metaboxd/internal/mcp/fields.generated.go
          git commit -m "$title"
          git push origin "$BRANCH"

          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --state open --json number --jq '.[].number')
          if [ -n "$pr" ]; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
