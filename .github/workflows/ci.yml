name: CI

on:
  # A branch with a PR is checked by the pull_request event alone: an unfiltered push
  # trigger would run every such push twice.
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run still checking its previous commit. On main a run in
# progress is never cancelled, but a newer push replaces a pending one in the group, so a
# merge commit may end without a verdict; the release workflow checks for one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # setup-go saves the cache once per key, so a key shared by two jobs loses the modules of
      # the job that finishes second. The Makefile pins golangci-lint, which `go run` fetches.
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            Makefile
            apps/metaboxd/go.mod
            tools/schemagen/go.mod
            tools/schemagen/go.sum

      # govet is part of the golangci-lint set, a separate step is not needed. The generator
      # is checked with the fork's tags, which `go vet` did not do here.
      - name: Go lint
        run: make lint

      # -race catches races that are not visible on a single developer core.
      - run: cd apps/metaboxd && go test -race ./...

  # The generator is a separate module and builds the fork; `go test` in the daemon does not see it.
  schemagen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            tools/schemagen/go.mod
            tools/schemagen/go.sum

      - name: Schemagen tests
        run: make test-schemagen

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # commitlint checks the whole commit range of the PR, so history is needed
          fetch-depth: 0

      # Go is needed only for `make daemon` at the end, and the daemon has no modules to cache.
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint --config commitlint.config.mjs
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter web test
      - run: pnpm --filter web build

      # Advice, not a check: the rule set belongs to the vendor and changes between
      # minor versions, so a failing step does not fail the build. What the repository
      # has already accepted as the norm is disabled in `apps/web/doctor.config.jsonc`.
      - name: React doctor
        continue-on-error: true
        run: pnpm --filter web run lint:react

      # Full build: only here it is checked that the built SPA reaches
      # go:embed and ends up in the binary (AC-17).
      - run: make daemon

  # Tests that need a real browser: Base UI dropdowns, layout, pointer events. A separate job,
  # so the Chromium download does not hold back the main frontend checks.
  web-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The headless shell is enough for headless runs; --with-deps installs its system libraries.
      - name: Chromium
        run: pnpm --filter web exec playwright install --with-deps --only-shell chromium

      - run: pnpm --filter web test:browser

  # The main branch rule requires a check named `checks`. A job skipped because a dependency
  # failed counts as passed for the rule, so the job always runs and fails by itself.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [go, schemagen, web, web-browser, integration]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  # AC-22: integration run on the target environment image of the same OpenWrt
  # branch as on the device. CI has no device firmware, so the base is
  # the public rootfs; it differs from the owner's test bench only in architecture and in
  # the branch being a release, not SNAPSHOT.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      METABOX_BASE_IMAGE: openwrt/rootfs:x86-64-25.12.4
      # For the x86-64 tag the architecture in the manifest is the usual one (amd64), unlike
      # aarch64_generic, so the platform here is normal.
      OPENWRT_PLATFORM: linux/amd64
      DAEMON_BINARY: dist/metaboxd-linux-amd64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: tools/schemagen/go.sum

      - name: Daemon build
        # OpenWrt uses musl: a glibc binary does not start there
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          ldflags="$(make -s ldflags VERSION=ci)"
          cd apps/metaboxd && go build -ldflags "$ldflags" -o "../../$DAEMON_BINARY" .

      - name: Environment
        timeout-minutes: 10
        run: docker compose -f .devcontainer/docker-compose.yml up -d target

      - name: Daemon ready
        timeout-minutes: 3
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "daemon is responding"; exit 0
            fi
            sleep 2
          done
          echo "daemon did not start" >&2
          docker compose -f .devcontainer/docker-compose.yml logs target
          exit 1

      - name: Apply cycle
        timeout-minutes: 5
        run: docker compose -f .devcontainer/docker-compose.yml exec -T target sh /usr/bin/apply-cycle-check

      - name: Reach check
        timeout-minutes: 5
        run: make reach-check

      # Temporary probe for issue #122: loops the step that hung in runs 40116156272,
      # 40134718809 and 40181241418 and dumps what is still alive when it hangs.
      - name: Dataplane hang probe
        timeout-minutes: 25
        run: |
          set -u
          in_target() { timeout 30 docker exec metabox-target-1 /usr/bin/dataplane-check "$@"; }
          client() {
            docker run --rm --network metabox_lan --ip 192.168.210.40 --cap-add NET_ADMIN alpine:3 \
              sh -c "ip route replace default via 192.168.210.2 && $1" >/dev/null 2>&1 || true
          }
          for i in $(seq 1 150); do
            # The sequence of sections 2 and 5: traffic through sing-box, two counters, then the log.
            case $((i % 2)) in
              0) client "nc -w 3 1.1.1.1 80 </dev/null"; set -- redirect-in ;;
              1) client "echo metabox | nc -u -w 1 1.1.1.1 9999"; set -- tproxy-in ;;
            esac
            in_target counter metabox_redirect 'redirect to' >/dev/null
            in_target counter metabox_mangle_prerouting 'tproxy ip to' >/dev/null
            if in_target log-has "$1" 192.168.210.40 >/dev/null 2>&1; then continue; fi
            rc=$?
            echo "iteration $i (log-has $1) exit $rc"
            [ "$rc" -eq 124 ] || continue
            echo "== host processes"
            ps -eo pid,ppid,stat,wchan:32,etime,cmd | grep -E 'docker|containerd|runc' | grep -v grep
            echo "== container processes"
            docker exec metabox-target-1 sh -c '
              for p in /proc/[0-9]*; do
                [ "${p#/proc/}" = "$$" ] && continue
                cmd=$(tr "\0" " " < "$p/cmdline" 2>/dev/null) || continue
                case "$cmd" in */usr/bin/dataplane-check\ *|logread*|grep*|*/logd\ *|*/ubusd*)
                  echo "-- pid ${p#/proc/} wchan=$(cat $p/wchan) state=$(awk "/^State/{print \$2}" $p/status) ppid=$(awk "/^PPid/{print \$2}" $p/status): $cmd"
                  ls -l $p/fd 2>/dev/null | awk "{print \"   fd\", \$9, \$10, \$11}"
                  for f in $p/fdinfo/*; do echo "   $(basename $f): $(tr "\n" " " < $f)"; done
                  sed "s/^/   stack /" $p/stack 2>/dev/null
                ;;
                esac
              done
              echo "-- ubus call log read lines=1"; ubus -t 5 call log read "{\"lines\":1}" | head -c 300; echo
            ' || true
            docker version
            exit 1
          done
          echo "no hang in 150 iterations"

      # Needs nft_tproxy and the nat modules on the runner kernel, which the target container shares.
      - name: Dataplane check
        timeout-minutes: 10
        run: make dataplane-check

      - name: Target logs
        if: failure()
        run: docker compose -f .devcontainer/docker-compose.yml logs target
