name: CI

on:
  push:
  pull_request:

jobs:
  # Быстрые проверки: типы, линтеры, юнит-тесты. Не требуют целевого окружения.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # commitlint проверяет весь диапазон коммитов PR — нужна история
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          # У демона зависимостей нет и go.sum тоже, поэтому кэш считается по
          # манифесту генератора: без пути setup-go ищет go.mod в корне, не
          # находит и каждый прогон тянет модули заново.
          cache-dependency-path: tools/schemagen/go.sum

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # govet входит в набор golangci-lint, отдельный шаг не нужен. Генератор
      # проверяется с тегами форка, чего `go vet` здесь не делал.
      - name: Линт Go (оба модуля)
        run: make lint

      # -race ловит гонки, которые на одном ядре разработчика не видны.
      - run: cd apps/metaboxd && go test -race ./...
      # Генератор — отдельный модуль, шаг выше его не видит.
      - name: Тесты генератора
        run: make test-schemagen
      - name: Сообщения коммитов
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint --config commitlint.config.mjs
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter web test
      - run: pnpm --filter web build

      # Сборка целиком: только здесь проверяется, что собранная SPA доезжает
      # до go:embed и попадает в бинарь (AC-17).
      - run: make daemon

  # AC-22: интеграционный прогон на том же образе целевого окружения,
  # что и в devcontainer. Отличаются только архитектура и тег rootfs.
  integration:
    runs-on: ubuntu-latest
    env:
      OPENWRT_TAG: x86-64-24.10.8
      # У тега x86-64 архитектура в манифесте обычная (amd64), в отличие от
      # aarch64_generic — поэтому здесь платформа нормальная.
      OPENWRT_PLATFORM: linux/amd64
      SINGBOX_ARCH: amd64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: tools/schemagen/go.sum

      - name: Сборка демона под целевую систему
        # OpenWrt на musl: бинарь с glibc там не запускается
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          cd apps/metaboxd && go build -ldflags "-s -w -X metabox/internal/version.Version=ci" -o ../../dist/metaboxd .

      - name: Поднять целевое окружение
        run: docker compose -f .devcontainer/docker-compose.yml up -d target

      - name: Дождаться запуска сервисов
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "демон отвечает"; exit 0
            fi
            sleep 2
          done
          echo "демон не поднялся" >&2
          docker compose -f .devcontainer/docker-compose.yml logs target
          exit 1

      - name: Цикл Apply (AC-21)
        run: docker compose -f .devcontainer/docker-compose.yml exec -T target sh /usr/bin/apply-cycle-check

      - name: Логи целевого окружения при провале
        if: failure()
        run: docker compose -f .devcontainer/docker-compose.yml logs target
