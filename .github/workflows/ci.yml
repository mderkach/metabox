name: CI

on:
  push:
  pull_request:

jobs:
  # Быстрые проверки: типы, линтеры, юнит-тесты. Не требуют целевого окружения.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # commitlint проверяет весь диапазон коммитов PR — нужна история
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          # У демона зависимостей нет и go.sum тоже, поэтому кэш считается по
          # манифесту генератора: без пути setup-go ищет go.mod в корне, не
          # находит и каждый прогон тянет модули заново.
          cache-dependency-path: tools/schemagen/go.sum

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # govet входит в набор golangci-lint, отдельный шаг не нужен. Генератор
      # проверяется с тегами форка, чего `go vet` здесь не делал.
      - name: Go lint
        run: make lint

      # -race ловит гонки, которые на одном ядре разработчика не видны.
      - run: cd apps/metaboxd && go test -race ./...
      # Генератор — отдельный модуль, шаг выше его не видит.
      - name: Schemagen tests
        run: make test-schemagen
      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint --config commitlint.config.mjs
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter web test
      - run: pnpm --filter web build

      # Совет, а не проверка: набор правил живёт у поставщика и меняется между
      # минорными версиями, поэтому падение шага сборку не валит. Что репозиторий
      # уже принял как норму, отключено в `apps/web/doctor.config.jsonc`.
      - name: React doctor
        continue-on-error: true
        run: pnpm --filter web run lint:react

      # Сборка целиком: только здесь проверяется, что собранная SPA доезжает
      # до go:embed и попадает в бинарь (AC-17).
      - run: make daemon

  # AC-22: интеграционный прогон на образе целевого окружения той же ветки
  # OpenWrt, что на устройстве. Прошивки устройства в CI нет, поэтому база —
  # публичный rootfs; отличаются от стенда владельца только архитектура и то,
  # что ветка релизная, а не SNAPSHOT.
  integration:
    runs-on: ubuntu-latest
    env:
      METABOX_BASE_IMAGE: openwrt/rootfs:x86-64-25.12.4
      # У тега x86-64 архитектура в манифесте обычная (amd64), в отличие от
      # aarch64_generic — поэтому здесь платформа нормальная.
      OPENWRT_PLATFORM: linux/amd64
      DAEMON_BINARY: dist/metaboxd-linux-amd64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: tools/schemagen/go.sum

      - name: Daemon build
        # OpenWrt на musl: бинарь с glibc там не запускается
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          cd apps/metaboxd && go build -ldflags "-s -w -X metabox/internal/version.Version=ci" -o "../../$DAEMON_BINARY" .

      - name: Environment
        run: docker compose -f .devcontainer/docker-compose.yml up -d target

      - name: Daemon ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "демон отвечает"; exit 0
            fi
            sleep 2
          done
          echo "демон не поднялся" >&2
          docker compose -f .devcontainer/docker-compose.yml logs target
          exit 1

      - name: Apply cycle
        run: docker compose -f .devcontainer/docker-compose.yml exec -T target sh /usr/bin/apply-cycle-check

      - name: Reach check
        run: make reach-check

      - name: Target logs
        if: failure()
        run: docker compose -f .devcontainer/docker-compose.yml logs target
