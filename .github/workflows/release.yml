name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      checks: read
      actions: read
    env:
      TAG: ${{ github.ref_name }}
      # The router's arch. There is no public rootfs for it, so the package is built on
      # aarch64_generic of the same branch and gets the arch explicitly.
      PKG_ARCH: aarch64_cortex-a53
      PUBLIC_KEY: keys/metabox-release.pem
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The tagged commit is checked against main, so history is needed
          fetch-depth: 0

      - name: Tag matches the version
        run: |
          version=$(cat VERSION)
          web=$(jq -r .version apps/web/package.json)
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG, VERSION $version"; exit 1; }
          [ "$web" = "$version" ] || { echo "::error::apps/web/package.json $web, VERSION $version"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          [ -s "$PUBLIC_KEY" ] || { echo "::error::$PUBLIC_KEY is missing"; exit 1; }

      # Being on main is not enough: a newer push replaces a pending run in the concurrency
      # group, so a commit may have no CI verdict. `checks` sums up every CI job, and its
      # latest check run is the verdict.
      - name: CI is green for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=checks" \
            --jq '.check_runs | sort_by(.started_at) | last | .conclusion // .status // empty')
          [ "$latest" = success ] || {
            echo "::error::the latest 'checks' run for $GITHUB_SHA is ${latest:-missing}, not success; re-run this workflow once CI on main is green"
            exit 1
          }
          echo "checks: $latest"

      - name: Restore verified publication bundle
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-bundle.py restore

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.bundle.outputs.restored != 'true'
        with:
          go-version-file: .go-version
          cache-dependency-path: tools/schemagen/go.sum

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.bundle.outputs.restored != 'true'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.bundle.outputs.restored != 'true'
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        if: steps.bundle.outputs.restored != 'true'

      # The key is on disk only for this step: the actions and installs above do not see it.
      - name: Signed package
        if: steps.bundle.outputs.restored != 'true'
        env:
          APK_SIGN_KEY_PEM: ${{ secrets.APK_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY_PEM" ] || { echo "::error::secret APK_SIGN_KEY is not set"; exit 1; }
          key="$RUNNER_TEMP/apk-sign-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$APK_SIGN_KEY_PEM" > "$key")
          make package APK_SIGN_KEY="$key"

      # The signature is checked against the key from the repository: a secret that does
      # not match the published key would give a package the router rejects.
      - name: Verify and name the package
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.23 sh -euc '
            mkdir /keys && cp "$1" /keys/
            apk verify --keys-dir /keys dist/metaboxd.apk
            apk adbdump dist/metaboxd.apk > dist/info
          ' sh "$PUBLIC_KEY"
          version=$(sed -n 's/^  version: //p' dist/info | head -1)
          arch=$(sed -n 's/^  arch: //p' dist/info | head -1)
          rm dist/info
          [ -n "$version" ] || { echo "::error::no version in the package"; exit 1; }
          [ "$arch" = "$PKG_ARCH" ] || { echo "::error::package arch $arch, expected $PKG_ARCH"; exit 1; }
          file="metaboxd-$version.apk"
          mv dist/metaboxd.apk "dist/$file"
          (cd dist && sha256sum "$file" > "$file.sha256")
          echo "PACKAGE=$file" >> "$GITHUB_ENV"

      - name: Prepare verified publication bundle
        if: steps.bundle.outputs.restored != 'true'
        run: python3 .github/scripts/release-bundle.py create

      - name: Persist verified publication bundle
        if: steps.bundle.outputs.restored != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: release-bundle/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh

  apk-repo:
    needs: release
    uses: ./.github/workflows/apk-repo.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
