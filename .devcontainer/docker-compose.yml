name: metabox

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    working_dir: /workspace
    volumes:
      - ../:/workspace
      # Own node_modules: the host ones hold native binaries for darwin.
      - web-node-modules:/workspace/apps/web/node_modules
      - root-node-modules:/workspace/node_modules
      - go-mod:/cache/go/mod
      - go-build:/cache/go/build
      - pnpm-store:/cache/pnpm
    environment:
      # The address is the IP of the wired network, not the service name: the dev proxy passes
      # the target in Host, and the daemon answers only to a Host with an IP literal.
      METABOX_API_TARGET: http://192.168.210.2:8080
    # The devcontainer attaches to this service: the main process must survive
    # tool crashes.
    command: sleep infinity
    networks: [lan]
    depends_on:
      - target

  vite:
    # The dev server starts in a separate mode (`make up-dev`): by default the test bench
    # serves the panel the same way the router does, from the daemon binary.
    profiles: [dev]
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    working_dir: /workspace/apps/web
    volumes:
      - ../:/workspace
      - web-node-modules:/workspace/apps/web/node_modules
      - root-node-modules:/workspace/node_modules
      - pnpm-store:/cache/pnpm
    ports:
      - '5173:5173' # Vite HMR
    environment:
      # The address is the IP of the wired network, not the service name: the dev proxy passes
      # the target in Host, and the daemon answers only to a Host with an IP literal.
      METABOX_API_TARGET: http://192.168.210.2:8080
      # Without a TTY pnpm does not rebuild node_modules and fails on the confirmation.
      CI: 'true'
    command: pnpm dev --host 0.0.0.0
    # The dev server sits in the wired network, the same one as the owner's machine.
    networks: [lan]
    depends_on:
      - target

  target:
    build:
      context: ..
      dockerfile: .devcontainer/target/Dockerfile
      args:
        # Image from the device firmware if it is built (`make stand-base`), otherwise
        # the public OpenWrt rootfs: CI has no firmware. Test bench variables live in
        # `.devcontainer/.env`, docker compose reads it.
        BASE_IMAGE: ${METABOX_BASE_IMAGE:-openwrt/rootfs:aarch64_generic-25.12.4}
        DAEMON_BINARY: ${DAEMON_BINARY:-dist/metaboxd-linux-arm64}
    platform: ${OPENWRT_PLATFORM:-linux/aarch64_generic}
    # procd as init: needs its own namespaces and the right to start services.
    privileged: true
    volumes:
      - singbox-etc:/etc/sing-box
    ports:
      - '8080:8080' # daemon REST API
      - '9090:9090' # Clash API sing-box
    # Three networks instead of one: the panel must be reachable from all local networks and from
    # no external one. Addresses are fixed: stand-init identifies the interface role by them,
    # Docker hands out eth* names in arbitrary order.
    networks:
      # Docker Desktop 29 delivers the port published to the host not here but to the
      # address of the guest network, and gw_priority does not change that (measured 2026-10-09).
      # So the guest zone of the test bench fw4 is open for input, like lan.
      lan:
        priority: 100
        ipv4_address: 192.168.210.2
      guest:
        priority: 50
        ipv4_address: 192.168.220.2
      wan:
        priority: 10
        ipv4_address: 192.168.230.2
    stop_signal: SIGTERM

networks:
  lan:
    ipam:
      config: [{ subnet: 192.168.210.0/24 }]
  guest:
    ipam:
      config: [{ subnet: 192.168.220.0/24 }]
  wan:
    # External network: it has no route to the other test bench networks, just as the router has no
    # route from the internet into its lan.
    internal: true
    ipam:
      config: [{ subnet: 192.168.230.0/24 }]

volumes:
  web-node-modules:
  root-node-modules:
  go-mod:
  go-build:
  pnpm-store:
  singbox-etc:
