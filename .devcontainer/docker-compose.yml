name: metabox

services:
  # Среда разработки: здесь живут Go-сборка, Vite и тесты.
  dev:
    build:
      # Контекст — корень репозитория: версии Node и pnpm образ берёт из
      # `.nvmrc` и `packageManager`, а не из собственных копий.
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
      args:
        GO_VERSION: ${GO_VERSION:-1.26.7}
    working_dir: /workspace
    volumes:
      - ../:/workspace
      # Собственный node_modules: в хостовом лежат нативные бинарники под darwin
      # (rolldown, esbuild), в linux-контейнере они не загружаются.
      - web-node-modules:/workspace/apps/web/node_modules
      # Корневой node_modules тоже свой: pnpm пишет в него состояние воркспейса,
      # и общий с хостом каталог после установки в контейнере заставляет
      # хостовый pnpm переустанавливать зависимости.
      - root-node-modules:/workspace/node_modules
      - go-mod:/cache/go/mod
      - go-build:/cache/go/build
      - pnpm-store:/cache/pnpm
    environment:
      # Демон живёт в target, dev-сервер проксирует к нему запросы API
      METABOX_API_TARGET: http://target:8080
    # sleep infinity намеренно: к этому сервису подключается devcontainer, и
    # главный процесс обязан переживать падения инструментов.
    command: sleep infinity
    depends_on:
      - target

  # Дев-сервер вынесен из dev отдельным сервисом: AC-20 требует поднимать фронт
  # с HMR той же командой, что и остальное, а занимать им главный процесс dev
  # нельзя — к нему подключается devcontainer.
  vite:
    build:
      # Контекст — корень репозитория: версии Node и pnpm образ берёт из
      # `.nvmrc` и `packageManager`, а не из собственных копий.
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
      args:
        GO_VERSION: ${GO_VERSION:-1.26.7}
    working_dir: /workspace/apps/web
    volumes:
      - ../:/workspace
      - web-node-modules:/workspace/apps/web/node_modules
      - root-node-modules:/workspace/node_modules
      - pnpm-store:/cache/pnpm
    ports:
      - '5173:5173' # Vite HMR
    environment:
      METABOX_API_TARGET: http://target:8080
      # Без TTY pnpm отказывается пересобирать node_modules и падает
      # (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY). CI=true — штатный для
      # pnpm способ работать без интерактивного подтверждения.
      CI: 'true'
    command: pnpm dev --host 0.0.0.0
    depends_on:
      - target

  # Целевое окружение: OpenWrt с procd, init.d и sing-box-extended.
  target:
    build:
      context: ./target
      dockerfile: Dockerfile
      args:
        OPENWRT_TAG: ${OPENWRT_TAG:-aarch64_generic-24.10.8}
        OPENWRT_PLATFORM: ${OPENWRT_PLATFORM:-linux/aarch64_generic}
        SINGBOX_VERSION: ${SINGBOX_VERSION:-1.13.18-extended-2.6.5}
        SINGBOX_ARCH: ${SINGBOX_ARCH:-arm64}
    # procd — это init: ему нужны собственные namespace и право поднимать сервисы.
    # Границу безопасности держит сам контейнер, внутрь смонтирован только dist/.
    platform: ${OPENWRT_PLATFORM:-linux/aarch64_generic}
    privileged: true
    volumes:
      - ../dist:/opt/metabox:ro
      - singbox-etc:/etc/sing-box
    ports:
      - '8080:8080' # REST API демона
      - '9090:9090' # Clash API sing-box
    stop_signal: SIGTERM

volumes:
  web-node-modules:
  root-node-modules:
  go-mod:
  go-build:
  pnpm-store:
  singbox-etc:
