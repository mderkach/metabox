name: metabox

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    working_dir: /workspace
    volumes:
      - ../:/workspace
      # Свои node_modules: в хостовых лежат нативные бинарники под darwin.
      - web-node-modules:/workspace/apps/web/node_modules
      - root-node-modules:/workspace/node_modules
      - go-mod:/cache/go/mod
      - go-build:/cache/go/build
      - pnpm-store:/cache/pnpm
    environment:
      METABOX_API_TARGET: http://target:8080
    # К сервису подключается devcontainer: главный процесс обязан переживать
    # падения инструментов.
    command: sleep infinity
    depends_on:
      - target

  vite:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    working_dir: /workspace/apps/web
    volumes:
      - ../:/workspace
      - web-node-modules:/workspace/apps/web/node_modules
      - root-node-modules:/workspace/node_modules
      - pnpm-store:/cache/pnpm
    ports:
      - '5173:5173' # Vite HMR
    environment:
      METABOX_API_TARGET: http://target:8080
      # Без TTY pnpm не пересоберёт node_modules и упадёт на подтверждении.
      CI: 'true'
    command: pnpm dev --host 0.0.0.0
    depends_on:
      - target

  target:
    build:
      context: ./target
      dockerfile: Dockerfile
      args:
        OPENWRT_TAG: ${OPENWRT_TAG:-aarch64_generic-24.10.8}
        OPENWRT_PLATFORM: ${OPENWRT_PLATFORM:-linux/aarch64_generic}
        SINGBOX_VERSION: ${SINGBOX_VERSION:-1.14.0-extended-2.7.1}
        SINGBOX_ARCH: ${SINGBOX_ARCH:-arm64}
    platform: ${OPENWRT_PLATFORM:-linux/aarch64_generic}
    # procd как init: нужны свои namespace и право поднимать сервисы.
    privileged: true
    volumes:
      - ../dist:/opt/metabox:ro
      - singbox-etc:/etc/sing-box
    ports:
      - '8080:8080' # REST API демона
      - '9090:9090' # Clash API sing-box
    stop_signal: SIGTERM

volumes:
  web-node-modules:
  root-node-modules:
  go-mod:
  go-build:
  pnpm-store:
  singbox-etc:
