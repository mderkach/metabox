version: '2'

linters:
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - gosec
    - nilnil
    - revive
  settings:
    exhaustive:
      # A switch on reflect.Kind lists what the schema can represent and
      # passes the rest to default. Requiring a branch for each reflect.Kind
      # constant means writing dead code.
      default-signifies-exhaustive: true
  exclusions:
    rules:
      # The generator reads the fork's constant package through parser.ParseDir, which does not
      # take build tags into account. Harmless for now: under tags this package holds
      # only boolean constants, and constantStrings takes the string ones. It becomes
      # an error when the fork adds a second variant of a file with strings, then
      # switch to golang.org/x/tools/go/packages.
      - path: types\.go
        text: 'SA1019: go/parser.ParseDir'
        linters: [staticcheck]

      # G204 and G702: the command name is the path to the sing-box binary or to the
      # init script, it comes to the daemon as a flag, not from a request, and singbox.New
      # rejects a relative path. Arguments go as a list, there is no shell in the chain,
      # so a command cannot be injected through them (DeviceIO.md).
      - path: internal/singbox/exec\.go
        text: 'G204|G702'
        linters: [gosec]

      # G204: the command is the daemon's own init script, a constant in main.go that
      # restart.New requires to be absolute, with the fixed argument `restart`; no shell.
      - path: internal/restart/restart\.go
        text: 'G204'
        linters: [gosec]

      # The schema cannot be obtained from the fork otherwise: registry options live in an unexported
      # field, and the test reads it through unsafe deliberately (ADR-0001).
      - path: _test\.go
        linters: [gosec]

      # G304: the path is built from `go list` output, not from user
      # input. G306: generated.ts is a source file in the repository, it has the permissions
      # of a regular file, not of a secret.
      - path: tools/schemagen/
        text: 'G304|G306'
        linters: [gosec]

      # G101: the Russian texts mention passwords and tokens ("wrong password",
      # "MCP token required"); they are messages, not credentials.
      - path: internal/locale/ru\.go
        text: 'G101'
        linters: [gosec]

      # G304: the path is built from the procfs and sysfs roots set by Options fields
      # and the process name read from /proc itself. There is no user input
      # in it, and reading goes only through these two trees.
      # G115: HeapInuse is the process heap size; it can overflow int64
      # only together with the address space.
      - path: internal/device/
        text: 'G304|G115'
        linters: [gosec]

      # G304, G703: the log file is named in log.output of the config and may lie anywhere
      # at all (/var/run, /tmp), so os.Root cannot hold it. sing-box itself writes there
      # as root, and only FATAL, ERROR and PANIC level lines with a length cap
      # go from the file into the failure reason.
      - path: internal/singbox/failure\.go
        text: 'G304|G703'
        linters: [gosec]

      # G304: the log file is named in log.output of the config, for the same reason as
      # above, os.Root cannot hold it; only the tail with a line cap is read,
      # and truncation goes through os.Root of the allowed directories. G204: the command name is
      # the path to logread from a flag, arguments are a list, there is no shell in the chain.
      - path: internal/logs/
        text: 'G304|G204'
        linters: [gosec]

      # G304: the path is built from the /proc/net root set by the Options field and
      # a table name from a constant list.
      - path: internal/diag/
        text: 'G304'
        linters: [gosec]

      # G710: the https redirect target is the request's own Host, and checkHost before
      # this middleware admits only an IP literal, localhost or the -allowed-origin
      # host, so a foreign name is refused before it could be sent back.
      - path: internal/httpapi/middleware\.go
        text: 'G710'
        linters: [gosec]

      # G124: the session cookie gets Secure only on a TLS request. With HTTPS off the
      # panel is served over plain http in the LAN, and a browser drops a Secure cookie
      # on such a page. HttpOnly and SameSite=Strict are always set.
      - path: internal/httpapi/auth\.go
        text: 'G124'
        linters: [gosec]
