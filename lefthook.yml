pre-commit:
  parallel: true
  jobs:
    - name: go-fmt
      glob: '*.go'
      run: gofmt -l {staged_files}
      fail_text: Не отформатировано, прогони gofmt -w

    - name: go-vet
      glob: '*.go'
      run: cd apps/metaboxd && go vet ./... && cd ../../tools/schemagen && go vet ./...

    - name: generated-schema
      glob: 'apps/web/src/shared/api/generated.ts'
      run: git diff --cached --name-only | grep -q '^tools/schemagen/'
      fail_text: Файл собирает `make schema`; коммить его вместе с правкой tools/schemagen

    - name: generated-contract
      glob: 'apps/web/src/shared/api/daemon.generated.ts'
      run: git diff --cached --name-only | grep -qE '^apps/metaboxd/'
      fail_text: Файл собирает `make schema-daemon`; коммить его вместе с правкой apps/metaboxd

    # oxlint и oxfmt падают, когда после игнора не осталось ни одного файла.
    - name: lint
      glob: '*.{ts,tsx,js,mjs}'
      exclude:
        - 'apps/web/src/shared/api/generated.ts'
        - 'apps/web/src/shared/api/daemon.generated.ts'
      run: pnpm exec oxlint {staged_files}

    - name: format
      glob: '*.{ts,tsx,js,mjs,json,css,md,yml,yaml}'
      exclude:
        - 'apps/web/src/shared/api/generated.ts'
        - 'apps/web/src/shared/api/daemon.generated.ts'
      run: pnpm exec oxfmt --check {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --config commitlint.config.mjs --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: lint-js
      run: pnpm lint

    - name: lint-go
      run: make lint

    - name: format
      run: pnpm format:check

    - name: tests
      run: make test

    - name: types
      run: pnpm --filter web build
