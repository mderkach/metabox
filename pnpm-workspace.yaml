# Monorepo workspace: applications live in apps/, repository tools in the root.
packages:
  - apps/web

# Since version 11 pnpm reads .npmrc only for registry and auth, everything else is here.

# Dependency versions are pinned exactly: a range gives a different lock on reinstall.
saveExact: true

# lefthook downloads its binary in postinstall, so the build is allowed explicitly.
# msw is forbidden on purpose: its postinstall puts mockServiceWorker.js into public/,
# from where the file would end up in dist and, through go:embed, in the daemon binary. The dev server
# serves this script straight from node_modules (the metabox-mocks plugin).
allowBuilds:
  lefthook: true
  msw: false

# Versions shared across the workspace, so the linter does not drift between packages.
catalog:
  oxfmt: 0.68.0
  oxlint: 1.81.0
  oxlint-tsgolint: 7.0.2001
