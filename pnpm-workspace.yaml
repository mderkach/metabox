# Воркспейс монорепо: приложения лежат в apps/, инструменты репозитория — в корне.
packages:
  - apps/web

# С 11-й версии pnpm читает .npmrc только для registry и auth, остальное здесь.

# Версии зависимостей фиксируются точно — диапазон даёт разный lock при переустановке.
saveExact: true

# lefthook скачивает свой бинарь в postinstall, поэтому сборка разрешена явно.
# msw запрещён намеренно: его postinstall кладёт mockServiceWorker.js в public/,
# оттуда файл уехал бы в dist и через go:embed — в бинарь демона. Дев-сервер
# отдаёт этот скрипт прямо из node_modules (плагин metabox-mocks).
allowBuilds:
  lefthook: true
  msw: false

# Общие для воркспейса версии — чтобы линтер не разъехался между пакетами.
catalog:
  oxfmt: 0.65.0
  oxlint: 1.80.0
